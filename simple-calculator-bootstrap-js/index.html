<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="calculator-card">
      <div class="text-center mb-3">
        <h1 class="fw-bold mb-1">Simple Calculator</h1>
        <p class="text-secondary mb-0">Bootstrap + JavaScript</p>
      </div>

      <div class="calculator">
        <div id="display" class="display" aria-live="polite">0</div>

        <div class="keys">
          <button class="btn key key-action" data-action="clear">AC</button>
          <button class="btn key key-action" data-action="delete">⌫</button>
          <button class="btn key key-action" data-value="%">%</button>
          <button class="btn key key-operator" data-value="/">÷</button>

          <button class="btn key" data-value="7">7</button>
          <button class="btn key" data-value="8">8</button>
          <button class="btn key" data-value="9">9</button>
          <button class="btn key key-operator" data-value="*">×</button>

          <button class="btn key" data-value="4">4</button>
          <button class="btn key" data-value="5">5</button>
          <button class="btn key" data-value="6">6</button>
          <button class="btn key key-operator" data-value="-">−</button>

          <button class="btn key" data-value="1">1</button>
          <button class="btn key" data-value="2">2</button>
          <button class="btn key" data-value="3">3</button>
          <button class="btn key key-operator" data-value="+">+</button>

          <button class="btn key key-zero" data-value="0">0</button>
          <button class="btn key" data-value=".">.</button>
          <button class="btn key key-equals" data-action="calculate">=</button>
        </div>
      </div>

      <p class="text-center text-secondary small mt-3 mb-0">
        Keyboard supported: 0–9, +, −, ×, ÷, Enter, Backspace, Escape
      </p>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
